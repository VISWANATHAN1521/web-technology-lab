<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comment Box - AngularJS</title>
  <script src="../lib/angular-1.6.9.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h2 { color: #dc2626; }
    .comment {
      width: 420px;
      margin: 8px 0;
      padding: 8px 12px;
      background-color: #fef2f2;
      border-left: 4px solid #dc2626;
    }
    .comment button { float: right; }
  </style>
</head>
<body ng-app="commentApp" ng-controller="commentCtrl">
  <h2>Simple Comment Box</h2>
  <input type="text" ng-model="name" placeholder="Your name"><br><br>
  <textarea ng-model="newComment" rows="3" cols="45" placeholder="Write a comment"></textarea><br>
  <button ng-click="addComment()">Post Comment</button>
  <h3>Comments ({{comments.length}})</h3>
  <div class="comment" ng-repeat="c in comments">
    <b>{{c.by}}:</b> {{c.text}}
    <button ng-click="removeComment($index)">Delete</button>
  </div>

  <script>
    var app = angular.module("commentApp", []);
    app.controller("commentCtrl", function ($scope) {
      $scope.name = "";
      $scope.newComment = "";
      $scope.comments = [
        { by: "Viswa", text: "AngularJS makes data binding easy." }
      ];
      $scope.addComment = function () {
        if ($scope.newComment.trim() !== "") {
          $scope.comments.push({
            by: $scope.name.trim() === "" ? "Guest" : $scope.name,
            text: $scope.newComment
          });
          $scope.newComment = "";
        }
      };
      $scope.removeComment = function (index) {
        $scope.comments.splice(index, 1);
      };
    });
  </script>
</body>
</html>
